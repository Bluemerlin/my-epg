name: Build EPG

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]        # runs when you change channels.xml etc.

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Get iptv-org/epg
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        working-directory: epg
        run: npm ci

      - name: Grab guide
        working-directory: epg
        run: |
          npm run grab --- \
            --channels=../channels.xml \
            --output=../out/guide.xml \
            --gzip \
            --days=3 \
            --maxConnections=5 || true
          ls -la ../out

      - name: Build combined playlist
        run: |
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/guide"
          python3 merge.py "$BASE/guide.xml.gz" sources.txt out/playlist.m3u out/extra_guides.txt

      - name: Merge extra guides
        run: |
          python3 merge_guides.py out/guide.xml out/extra_guides.txt out/guide.xml.gz
          ls -la out

      - name: Publish to 'guide' branch
        run: |
          cd out
          rm -f guide.xml extra_guides.txt   # keep just the .gz, much smaller
          git init -q -b guide
          git add guide.xml.gz playlist.m3u
          git -c user.name="epg-bot" -c user.email="epg-bot@users.noreply.github.com" \
            commit -q -m "Guide $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" guide
